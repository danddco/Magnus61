    <!DOCTYPE html>

             style="
                width:96%;

             ">

        <div class="tabla-wrap">
            <table>

                            Cargando datos directamente desde Supabase...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    
<script>
(function () {
    "use strict";

    const SUPABASE_URL = "https://ysyxjcwjtvklxvhwnxsi.supabase.co";

    // Publishable/anon key. Es una clave de cliente; la seguridad real
    // depende de las políticas RLS de Supabase.
    const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9." +
        "eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzeXhqY3dqdHZrbHh2aHdueHNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY1MDU0OTEsImV4cCI6MjA3MjA4MTQ5MX0." +
        "xjw3tRBPZoS4YX49VS7Nn1HT9Owv-q8fR4txMivjIuM";

    const TABLA = "gs_secuencias";
    const LIMITE_VISIBLE = 80;
    const LIMITE_LECTURA = 1000;

    const tbody = document.getElementById("secuencias-body");
    const estado = document.getElementById("estado-supabase");

    function texto(valor) {
        return valor === null || valor === undefined ? "" : String(valor);
    }

    function prioridadTexto(valor) {
        const p = texto(valor).trim();
        if (p === "1") return "Alta";
        if (p === "2") return "Media";
        if (p === "3") return "Baja";
        return p;
    }

    function fechaNumero(valor) {
        const s = texto(valor).slice(0, 10);
        const partes = s.split("-");

        if (partes.length !== 3) return 0;

        const y = Number(partes[0]);
        const m = Number(partes[1]);
        const d = Number(partes[2]);

        if (!y || !m || !d) return 0;

        return (y * 10000) + (m * 100) + d;
    }

    function formatearFecha(valor) {
        const s = texto(valor).slice(0, 10);
        const partes = s.split("-");

        if (partes.length !== 3) return s;

        const y = Number(partes[0]);
        const m = Number(partes[1]);
        const d = Number(partes[2]);

        if (!y || !m || !d) return s;

        // Se construye como fecha local para evitar que YYYY-MM-DD
        // retroceda un día por conversión UTC.
        const fecha = new Date(y, m - 1, d);

        let salida = new Intl.DateTimeFormat(
            "es-MX",
            {
                weekday: "long",
                day: "2-digit",
                month: "long",
                year: "numeric"
            }
        ).format(fecha);

        return salida.charAt(0).toUpperCase() + salida.slice(1);
    }

    function comparar(a, b) {
        const estadoA = texto(a.gs_estado).trim().toLowerCase();
        const estadoB = texto(b.gs_estado).trim().toLowerCase();

        const pendienteA = estadoA === "pendiente";
        const pendienteB = estadoB === "pendiente";

        if (pendienteA !== pendienteB) {
            return pendienteA ? -1 : 1;
        }

        const idA = Number(a.gs_id) || 0;
        const idB = Number(b.gs_id) || 0;

        const fechaA = fechaNumero(a.gs_fecha);
        const fechaB = fechaNumero(b.gs_fecha);

        if (pendienteA && pendienteB) {
            let prioridadA = Number(texto(a.gs_prior).trim());
            let prioridadB = Number(texto(b.gs_prior).trim());

            if (!Number.isFinite(prioridadA)) prioridadA = 999;
            if (!Number.isFinite(prioridadB)) prioridadB = 999;

            if (prioridadA !== prioridadB) {
                return prioridadA - prioridadB;
            }

            if (fechaA !== fechaB) {
                return fechaB - fechaA;
            }

            return idB - idA;
        }

        if (fechaA !== fechaB) {
            return fechaB - fechaA;
        }

        return idB - idA;
    }

    function claseRegistro(registro) {
        const prioridad = texto(registro.gs_prior).trim();
        const estadoRegistro = texto(registro.gs_estado).trim().toLowerCase();
        const fechaCum = texto(registro.gs_fecha_cum).trim();

        const cumplido =
            Boolean(fechaCum) ||
            estadoRegistro === "resuelto";

        if (cumplido) return "cumplido";
        if (prioridad === "1") return "prioridad-alta";
        if (prioridad === "2") return "prioridad-media";
        if (prioridad === "3") return "prioridad-baja";

        return "";
    }

    function crearCelda(etiqueta, valor, clase, negrita) {
        const td = document.createElement("td");
        td.dataset.label = etiqueta;

        if (clase) td.className = clase;
        if (negrita) td.style.fontWeight = "700";

        td.textContent = texto(valor);
        return td;
    }

    function renderizar(registros) {
        tbody.replaceChildren();

        if (!registros.length) {
            const tr = document.createElement("tr");
            const td = document.createElement("td");

            td.colSpan = 6;
            td.style.textAlign = "center";
            td.style.padding = "24px";
            td.textContent = "No hay secuencias para mostrar.";

            tr.appendChild(td);
            tbody.appendChild(tr);
            return;
        }

        for (const registro of registros) {
            const tr = document.createElement("tr");
            tr.className = claseRegistro(registro);

            const proyecto = crearCelda(
                "Proyecto",
                registro.gs_proyecto,
                "",
                true
            );
            proyecto.style.fontWeight = "800";

            tr.appendChild(proyecto);

            tr.appendChild(
                crearCelda(
                    "Proceso",
                    registro.gs_proceso,
                    "",
                    false
                )
            );

            tr.appendChild(
                crearCelda(
                    "Fecha",
                    formatearFecha(registro.gs_fecha),
                    "fecha",
                    false
                )
            );

            tr.appendChild(
                crearCelda(
                    "Descripción",
                    registro.gs_desc,
                    "",
                    true
                )
            );

            tr.appendChild(
                crearCelda(
                    "Prioridad",
                    prioridadTexto(registro.gs_prior),
                    "prioridad",
                    false
                )
            );

            const estadoTd = document.createElement("td");
            estadoTd.dataset.label = "Estado";
            estadoTd.style.fontWeight = "700";

            const estadoRegistro =
                texto(registro.gs_estado).trim();

            const fechaCum =
                texto(registro.gs_fecha_cum).trim();

            const cumplido =
                Boolean(fechaCum) ||
                estadoRegistro.toLowerCase() === "resuelto";

            if (
                estadoRegistro.toLowerCase() === "pendiente" &&
                !cumplido
            ) {
                const badge = document.createElement("span");
                badge.className = "estado-pendiente";
                badge.textContent = "Pendiente";
                estadoTd.appendChild(badge);
            } else if (cumplido) {
                estadoTd.textContent = "Resuelto";
            } else {
                estadoTd.textContent = estadoRegistro;
            }

            tr.appendChild(estadoTd);
            tbody.appendChild(tr);
        }
    }

    function actualizarFechaFooter() {
        const destino = document.getElementById("fecha-hora-dinamica");
        if (!destino) return;

        const ahora = new Date();

        const fecha = ahora.toLocaleDateString(
            "es-MX",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );

        const hora = ahora.toLocaleTimeString(
            "es-MX",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }
        );

        destino.textContent = `${fecha} ${hora}`;
    }

    async function cargarSecuencias() {
        estado.textContent = "Actualizando desde Supabase...";

        const columnas = [
            "gs_id",
            "gs_proceso",
            "gs_proyecto",
            "gs_lote",
            "gs_fecha",
            "gs_desc",
            "gs_ctda",
            "gs_prior",
            "gs_estado",
            "gs_ver",
            "gs_fecha_cum"
        ].join(",");

        const params = new URLSearchParams({
            select: columnas,
            gs_ver: "neq.N",
            limit: String(LIMITE_LECTURA)
        });

        const url =
            `${SUPABASE_URL}/rest/v1/${TABLA}?${params.toString()}`;

        try {
            const respuesta = await fetch(
                url,
                {
                    method: "GET",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                        "Accept": "application/json"
                    },
                    cache: "no-store"
                }
            );

            if (!respuesta.ok) {
                const detalle = await respuesta.text();

                throw new Error(
                    `HTTP ${respuesta.status}: ${detalle}`
                );
            }

            const datos = await respuesta.json();

            if (!Array.isArray(datos)) {
                throw new Error(
                    "Supabase no devolvió una lista de registros."
                );
            }

            datos.sort(comparar);

            const visibles = datos.slice(
                0,
                LIMITE_VISIBLE
            );

            renderizar(visibles);
            actualizarFechaFooter();

            const ahora = new Date().toLocaleTimeString(
                "es-MX",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );

            estado.textContent =
                `Supabase conectado · ${visibles.length} registros · ${ahora}`;

        } catch (error) {
            console.error(error);

            tbody.replaceChildren();

            const tr = document.createElement("tr");
            const td = document.createElement("td");

            td.colSpan = 6;
            td.style.textAlign = "center";
            td.style.padding = "24px";
            td.style.color = "#a02a2a";
            td.textContent =
                "No fue posible obtener los datos desde Supabase.";

            tr.appendChild(td);
            tbody.appendChild(tr);

            estado.textContent =
                "Error de conexión con Supabase";
            estado.style.color = "#a02a2a";
        }
    }

    actualizarFechaFooter();
    cargarSecuencias();

    // Actualización automática sin recargar la página.
    window.setInterval(
        cargarSecuencias,
        60000
    );
})();
</script>

</body>
