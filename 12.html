<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Contador - Máquinas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2933;
    }

    .topbar {
      background: #17384d;
      color: white;
      padding: 22px 24px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
    }

    .topbar h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
    }

    .topbar p {
      margin: 6px 0 0;
      color: #d8e5ec;
      font-size: 14px;
    }

    .contenedor {
      max-width: 1050px;
      margin: 28px auto;
      padding: 0 18px;
    }

    .estado {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 18px;
      box-shadow: 0 3px 14px rgba(0,0,0,.07);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .punto {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #d39e00;
      flex: 0 0 auto;
    }

    .punto.ok {
      background: #1f9d55;
    }

    .punto.error {
      background: #c62828;
    }

    #textoEstado {
      font-weight: 600;
    }

    #ultimaActualizacion {
      margin-left: auto;
      color: #60727d;
      font-size: 13px;
    }

    .resumen {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .tarjeta {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 3px 14px rgba(0,0,0,.07);
    }

    .tarjeta .titulo {
      font-size: 12px;
      color: #6b7c86;
      text-transform: uppercase;
      letter-spacing: .7px;
      margin-bottom: 6px;
    }

    .tarjeta .dato {
      font-size: 28px;
      font-weight: 700;
      color: #17384d;
      word-break: break-word;
    }

    .tabla-wrap {
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 14px rgba(0,0,0,.07);
      overflow: hidden;
    }

    .tabla-titulo {
      padding: 18px 20px;
      border-bottom: 1px solid #e7ecef;
      font-weight: 700;
      font-size: 17px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px 18px;
      text-align: left;
      border-bottom: 1px solid #edf1f3;
    }

    th {
      background: #f8fafb;
      color: #53656f;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    tbody tr:hover {
      background: #f8fbfc;
    }

    .revision {
      font-weight: 700;
      color: #315e7d;
    }

    .valor {
      font-weight: 700;
      color: #0f6d93;
      font-size: 19px;
    }

    .sin-datos {
      padding: 35px 20px;
      text-align: center;
      color: #75858e;
    }

    .error-box {
      display: none;
      background: #fff0f0;
      border: 1px solid #efb7b7;
      color: #8a1c1c;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      .resumen {
        grid-template-columns: 1fr;
      }

      #ultimaActualizacion {
        width: 100%;
        margin-left: 22px;
      }

      .tabla-wrap {
        overflow-x: auto;
      }

      table {
        min-width: 560px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <h1>ESP32 CONTADOR</h1>
    <p>Datos en tiempo real desde Firebase Firestore</p>
  </header>

  <main class="contenedor">

    <section class="estado">
      <div id="puntoEstado" class="punto"></div>
      <div id="textoEstado">Conectando con Firebase...</div>
      <div id="ultimaActualizacion">—</div>
    </section>

    <div id="errorBox" class="error-box"></div>

    <section class="resumen">
      <div class="tarjeta">
        <div class="titulo">Máquinas</div>
        <div id="totalRegistros" class="dato">0</div>
      </div>

      <div class="tarjeta">
        <div class="titulo">Última revisión</div>
        <div id="ultimaRevision" class="dato">—</div>
      </div>

      <div class="tarjeta">
        <div class="titulo">Último valor</div>
        <div id="ultimoValor" class="dato">—</div>
      </div>
    </section>

    <section class="tabla-wrap">
      <div class="tabla-titulo">
        Colección Firestore: maquinas
      </div>

      <table>
        <thead>
          <tr>
            <th>Máquina / Documento</th>
            <th>Revisión</th>
            <th>Valor</th>
          </tr>
        </thead>

        <tbody id="tablaDatos">
          <tr>
            <td colspan="3" class="sin-datos">
              Esperando datos de Firebase...
            </td>
          </tr>
        </tbody>
      </table>
    </section>

  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getFirestore,
      collection,
      onSnapshot
    } from
      "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


    // =========================================================
    // CONFIGURACIÓN FIREBASE
    // =========================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBugPt_sFISyQZn0GhlQ6Dd8jrpCjk4xMI",
      authDomain: "esp32-contador-b228b.firebaseapp.com",
      projectId: "esp32-contador-b228b",
      storageBucket: "esp32-contador-b228b.firebasestorage.app",
      messagingSenderId: "30984927729",
      appId: "1:30984927729:web:dd780295eccb9895206c50",
      measurementId: "G-PC8SFELW5M"
    };


    // =========================================================
    // FIRESTORE
    // =========================================================
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // IMPORTANTE:
    // La colección real según tus reglas es "maquinas".
    const NOMBRE_COLECCION = "maquinas";


    // =========================================================
    // ELEMENTOS DE PANTALLA
    // =========================================================
    const tabla =
      document.getElementById("tablaDatos");

    const puntoEstado =
      document.getElementById("puntoEstado");

    const textoEstado =
      document.getElementById("textoEstado");

    const ultimaActualizacion =
      document.getElementById("ultimaActualizacion");

    const totalRegistros =
      document.getElementById("totalRegistros");

    const ultimaRevision =
      document.getElementById("ultimaRevision");

    const ultimoValor =
      document.getElementById("ultimoValor");

    const errorBox =
      document.getElementById("errorBox");


    function escapar(texto) {
      return String(texto ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function marcarConectado() {
      puntoEstado.className = "punto ok";
      textoEstado.textContent =
        "Conectado a Firebase";

      errorBox.style.display =
        "none";
    }


    function marcarError(error) {
      puntoEstado.className =
        "punto error";

      textoEstado.textContent =
        "Error de Firebase";

      errorBox.style.display =
        "block";

      const mensaje =
        error?.message || String(error);

      errorBox.innerHTML =
        "<strong>No se pudieron leer los datos.</strong><br>" +
        escapar(mensaje) +
        "<br><br>" +
        "Si aparece <b>Missing or insufficient permissions</b>, " +
        "verifica que hayas publicado la regla de lectura para " +
        "la colección <b>maquinas</b>.";
    }


    function ordenarRegistros(registros) {
      return registros.sort(
        (a, b) => {
          const na =
            Number(a.revision);

          const nb =
            Number(b.revision);

          if (
            !Number.isNaN(na) &&
            !Number.isNaN(nb)
          ) {
            return na - nb;
          }

          return String(a.revision)
            .localeCompare(
              String(b.revision),
              "es",
              {
                numeric: true
              }
            );
        }
      );
    }


    // =========================================================
    // ESCUCHA EN TIEMPO REAL
    // =========================================================
    const referencia =
      collection(
        db,
        NOMBRE_COLECCION
      );


    onSnapshot(

      referencia,

      (snapshot) => {

        marcarConectado();

        const registros = [];


        snapshot.forEach(
          (documento) => {

            const data =
              documento.data();

            registros.push({
              id: documento.id,
              revision:
                data.revision ?? "",
              valor:
                data.valor ?? ""
            });

          }
        );


        ordenarRegistros(
          registros
        );


        totalRegistros.textContent =
          registros.length;


        if (
          registros.length === 0
        ) {

          ultimaRevision.textContent =
            "—";

          ultimoValor.textContent =
            "—";

          tabla.innerHTML = `
            <tr>
              <td colspan="3" class="sin-datos">
                Firestore respondió correctamente,
                pero la colección "maquinas" no tiene
                documentos visibles.
              </td>
            </tr>
          `;

        }
        else {

          const ultimo =
            registros[
              registros.length - 1
            ];


          ultimaRevision.textContent =
            ultimo.revision;

          ultimoValor.textContent =
            ultimo.valor;


          tabla.innerHTML =
            registros
              .map(
                (r) => `
                  <tr>
                    <td>${escapar(r.id)}</td>
                    <td class="revision">${escapar(r.revision)}</td>
                    <td class="valor">${escapar(r.valor)}</td>
                  </tr>
                `
              )
              .join("");

        }


        ultimaActualizacion.textContent =
          "Actualizado: " +
          new Date()
            .toLocaleString(
              "es-MX"
            );
      },


      (error) => {

        console.error(
          "Error Firestore:",
          error
        );

        marcarError(
          error
        );
      }
    );

  </script>
</body>
</html>
