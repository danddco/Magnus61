<style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #26333f;
        }

        #cabecera {
            width: 100%;
            min-height: 72px;
            padding: 8px 18px;
            margin-bottom: 22px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 14px;
            background: linear-gradient(135deg, #1f4e78, #346b98);
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.16);
        }

        .logo-contenedor {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 7px;
            background: white;
            border-radius: 8px;
        }

        .logo {
            display: block;
            height: 52px;
            width: auto;
            max-width: 150px;
            object-fit: contain;
        }

        #titulo {
            margin: 0;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: .2px;
            color: white;
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 92px;
            min-height: 42px;
            padding: 8px 15px;
            border: 1px solid rgba(255,255,255,.55);
            border-radius: 8px;
            background: white;
            color: #1f4e78;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 1px 3px rgba(0,0,0,.14);
            transition: background .15s ease, transform .15s ease;
        }

        .home-link:hover {
            background: #eef5fa;
            transform: translateY(-1px);
        }

        .home-link:active {
            transform: translateY(0);
        }

        main {
            width: min(1400px, 96%);
            margin: 0 auto;
            padding: 4px 0 30px;
        }

        h1.seccion-principal {
            text-align: center;
            color: #1f4e78;
            margin: 10px 0 18px;
            font-size: 30px;
        }

        .separador {
            text-align: center;
            color: #657786;
            margin: 20px 0 8px;
            font-weight: normal;
            letter-spacing: 2px;
        }

        h2 {
            text-align: center;
            color: #30485d;
            margin: 8px 0 14px;
        }

        .tabla-wrap {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 18px;
        }

        table {
            border-collapse: collapse;
            width: 80%;
            min-width: 680px;
            margin: auto;
            font-size: 20px;
            font-weight: bold;
            text-align: left;
            background: white;
            box-shadow: 0 3px 10px rgba(0,0,0,.05);
        }

        th, td {
            border: 1px solid #d8dee5;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #eef3f7;
            color: #30485d;
        }

        .alerta {
            background-color: #f8d7da;
            color: #721c24;
        }

        .espacio-footer {
            height: 28px;
        }

        footer {
            width: 100%;
            padding: 14px 18px;
            background: linear-gradient(135deg, #1f4e78, #346b98);
            color: white;
            text-align: center;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.14);
        }

        footer p {
            margin: 3px 0;
            line-height: 1.35;
        }

        footer .copyright {
            font-size: 14px;
            font-weight: 700;
        }

        footer .fecha-hora {
            font-size: 13px;
            color: #e7f0f7;
        }

        

        
    
        .seccion-tecnica {
            margin-top: 24px;
            padding: 22px;
            background: #ffffff;
            border: 1px solid #d8dee5;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.04);
        }

        .seccion-tecnica h2 {
            margin: 0 0 6px;
            color: #1f4e78;
            font-size: 26px;
        }

        .subtitulo-tecnico {
            margin: 0 0 18px;
            color: #657786;
            text-align: center;
        }

        .imagen-placa {
            margin: 22px 0 4px;
            text-align: center;
        }

        .imagen-placa img {
            display: block;
            width: auto;
            max-width: min(100%, 1100px);
            max-height: 760px;
            margin: 0 auto;
            padding: 8px;
            border: 1px solid #d8dee5;
            border-radius: 10px;
            background: white;
            object-fit: contain;
        }

        .pie {
            margin-top: 10px;
            color: #657786;
            font-size: 14px;
            text-align: center;
        }

        .grid-tecnico {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 22px;
        }

        .tarjeta-tecnica {
            padding: 16px;
            border: 1px solid #d8dee5;
            border-radius: 9px;
            background: #fbfcfd;
        }

        .tarjeta-tecnica h3 {
            margin: 0 0 7px;
            color: #1f4e78;
            font-size: 18px;
        }

        .tarjeta-tecnica p {
            margin: 5px 0;
            line-height: 1.5;
        }

        .nota-tecnica {
            margin-top: 16px;
            padding: 13px 16px;
            border-left: 5px solid #ddb100;
            border-radius: 6px;
            background: #fff3cd;
            color: #6f5900;
        }

    function texto(v) {
        return v === null || v === undefined
            ? ""
            : String(v);
    }


    function numero(v) {
        const n = Number(v);
        return Number.isFinite(n) ? n : 0;
    }


    function numeroVisible(v) {
        const n = numero(v);

        return Number.isInteger(n)
            ? String(n)
            : String(Number(n.toFixed(6)));
    }


    function fechaBase(v) {
        const s = texto(v);
        const m = s.match(/\d{4}-\d{2}-\d{2}/);
        return m ? m[0] : "";
    }


    function fechaConDia(v) {
        const fecha = fechaBase(v);

        if (!fecha) {
            return texto(v);
        }

        const [y, m, d] =
            fecha.split("-").map(Number);

        const f =
            new Date(y, m - 1, d);

        const dias = [
            "Domingo",
            "Lunes",
            "Martes",
            "Miércoles",
            "Jueves",
            "Viernes",
            "Sábado"
        ];

        return `${dias[f.getDay()]} ${fecha}`;
    }


    function fechaMayor(...valores) {
        const fechas =
            valores
                .map(fechaBase)
                .filter(Boolean)
                .sort();

        return fechas.length
            ? fechas[fechas.length - 1]
            : "";
    }


    function normalizar(v) {
        return texto(v)
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .trim()
            .toLowerCase();
    }


    function slugProyecto(nombre) {

    function idsEspecificos(nombreProyecto) {

    async function fetchTabla(
        tabla,
        select,
        filtros = {}
    ) {
        const total = [];
        let offset = 0;

        while (true) {
            const p =
                new URLSearchParams({
                    select,
                    limit: String(PAGE_SIZE),
                    offset: String(offset)
                });

            for (
                const [k, v]
                of Object.entries(filtros)
            ) {
                p.set(k, v);
            }

            const url =
                `${SUPABASE_URL}/rest/v1/` +
                `${tabla}?${p.toString()}`;

            const r =
                await fetch(
                    url,
                    {
                        method: "GET",
                        headers: {
                            "apikey": ANON_KEY,
                            "Authorization":
                                `Bearer ${ANON_KEY}`,
                            "Accept":
                                "application/json"
                        },
                        cache: "no-store"
                    }
                );

            if (!r.ok) {
                const detalle =
                    await r.text();

                throw new Error(
                    `${tabla}: HTTP ${r.status}: ` +
                    detalle
                );
            }

            const datos =
                await r.json();

            if (!Array.isArray(datos)) {
                throw new Error(
                    `${tabla}: respuesta inválida`
                );
            }

            total.push(...datos);

            if (datos.length < PAGE_SIZE) {
                break;
            }

            offset += PAGE_SIZE;
        }

        return total;
    }

    function renderDisponibilidad(
        bloque,
        proyecto,
        secuencias
    ) {
        let entrada = 0;
        let salida = 0;
        let venta = 0;
        let ventaPreparada = 0;

        let fechaEntrada = "";
        let fechaSalida = "";

        for (const r of secuencias) {
            const proc =
                texto(r.gs_proceso).trim();

            const cant =
                numero(r.gs_ctda);

            const fecha =
                fechaBase(r.gs_fecha);

            if (proc === "Fabricacion-Entrada") {
                entrada += cant;
                fechaEntrada =
                    fechaMayor(
                        fechaEntrada,
                        fecha
                    );
            } else if (
                proc === "Fabricacion-Salida"
            ) {
                salida += cant;
                fechaSalida =
                    fechaMayor(
                        fechaSalida,
                        fecha
                    );
            } else if (
                proc === "Venta-Concretada"
            ) {
                venta += cant;
            } else if (
                proc === "Venta-Preparada"
            ) {
                ventaPreparada += cant;
            }
        }

        const enFabricacion =
            entrada - salida;

        const listasEnviar =
            salida - venta - ventaPreparada;

        const fechaFabricacion =
            fechaMayor(
                fechaEntrada,
                fechaSalida
            );

        const fechaDisponible =
            salida > 0
                ? fechaSalida
                : "";

        const tbody =
            bloque.querySelector(
                ".tabla-disponibilidad tbody"
            );

        tbody.replaceChildren();

        const tr =
            document.createElement("tr");

        tr.appendChild(
            crearCelda(
                proyecto,
                "Proyecto"
            )
        );

        tr.appendChild(
            crearCeldaNumero(
                enFabricacion,
                "En fabricación"
            )
        );

        tr.appendChild(
            crearCelda(
                fechaConDia(
                    fechaFabricacion
                ),
                "Fecha fabricación",
                "fecha-celda"
            )
        );

        tr.appendChild(
            crearCeldaNumero(
                listasEnviar,
                "Lista para enviar"
            )
        );

        tr.appendChild(
            crearCelda(
                fechaConDia(
                    fechaDisponible
                ),
                "Fecha disponible",
                "fecha-celda"
            )
        );

        tbody.appendChild(tr);
    }


    function prioridadNumerica(v) {
        const n =
            Number(v);

        return Number.isFinite(n)
            ? n
            : 999;
    }


    function prioridadVisible(v) {
        const n =
            Number(v);

        if (n === 1) {
            return "Alta";
        }

        if (n === 2) {
            return "Media";
        }

        if (n === 3) {
            return "Baja";
        }

        return texto(v).trim();
    }


    function claseEstado(estado) {
        const s =
            texto(estado)
                .trim()
                .toLowerCase();

        if (
            [
                "resuelto",
                "cumplido",
                "completado",
                "terminado"
            ].includes(s)
        ) {
            return "seq-resuelto";
        }

        if (
            [
                "pendiente",
                "no cumplido",
                "incumplido"
            ].includes(s)
        ) {
            return "seq-pendiente";
        }

        if (
            s.includes("proceso") ||
            ["en curso", "activo"].includes(s)
        ) {
            return "seq-proceso";
        }

        return "seq-neutral";
    }


    function renderSecuencias(
        bloque,
        secuencias
    ) {
        const tbody =
            bloque.querySelector(
                ".tabla-secuencias tbody"
            );

        tbody.replaceChildren();

        const filas =
            secuencias
                .filter(
                    r =>
                        texto(r.gs_ver)
                            .trim()
                            .toUpperCase()
                        !== "N"
                )
                .sort((a, b) => {
                    const aPend =
                        normalizar(a.gs_estado)
                        === "pendiente";

                    const bPend =
                        normalizar(b.gs_estado)
                        === "pendiente";

                    if (aPend !== bPend) {
                        return aPend
                            ? -1
                            : 1;
                    }

                    if (aPend && bPend) {
                        const dp =
                            prioridadNumerica(
                                a.gs_prior
                            )
                            -
                            prioridadNumerica(
                                b.gs_prior
                            );

                        if (dp !== 0) {
                            return dp;
                        }

                        const fa =
                            fechaBase(a.gs_fecha);

                        const fb =
                            fechaBase(b.gs_fecha);

                        if (fa !== fb) {
                            return fb.localeCompare(fa);
                        }

                        return (
                            numero(b.gs_id)
                            -
                            numero(a.gs_id)
                        );
                    }

                    const fa =
                        fechaBase(a.gs_fecha_cum)
                        ||
                        fechaBase(a.gs_fecha);

                    const fb =
                        fechaBase(b.gs_fecha_cum)
                        ||
                        fechaBase(b.gs_fecha);

                    if (fa !== fb) {
                        return fb.localeCompare(fa);
                    }

                    return (
                        numero(b.gs_id)
                        -
                        numero(a.gs_id)
                    );
                });

        if (!filas.length) {
            const tr =
                document.createElement("tr");

            const td =
                crearCelda(
                    "Sin secuencias registradas.",
                    ""
                );

            td.colSpan = 5;
            tr.appendChild(td);
            tbody.appendChild(tr);
            return;
        }

        for (const r of filas) {
            const tr =
                document.createElement("tr");

            tr.className =
                claseEstado(r.gs_estado);

            tr.appendChild(
                crearCelda(
                    r.gs_proceso,
                    "Proceso"
                )
            );

            tr.appendChild(
                crearCelda(
                    prioridadVisible(
                        r.gs_prior
                    ),
                    "Prioridad",
                    "prioridad-celda"
                )
            );

            tr.appendChild(
                crearCelda(
                    fechaConDia(
                        r.gs_fecha
                    ),
                    "Fecha",
                    "fecha-celda"
                )
            );

            const estadoTd =
                document.createElement("td");

            estadoTd.className =
                "estado-celda";

            estadoTd.dataset.label =
                "Estado";

            const etiqueta =
                document.createElement("span");

            etiqueta.className =
                "estado-etiqueta";

            etiqueta.textContent =
                "Estado";

            const valor =
                document.createElement("span");

            valor.className =
                "estado-valor";

            const estadoOriginal =
                texto(r.gs_estado).trim();

            if (
                normalizar(estadoOriginal)
                === "pendiente"
            ) {
                valor.textContent =
                    "Pendiente";
            } else if (
                normalizar(estadoOriginal)
                === "resuelto"
            ) {
                valor.textContent =
                    "Resuelto";
            } else {
                valor.textContent =
                    estadoOriginal;
            }

            estadoTd.appendChild(etiqueta);
            estadoTd.appendChild(valor);
            tr.appendChild(estadoTd);

            tr.appendChild(
                crearCelda(
                    r.gs_desc,
                    "Descripción",
                    "descripcion-celda"
                )
            );

            tbody.appendChild(tr);
        }
    }


    function mapaStock(stockRows) {
        const mapa =
            new Map();

        for (const r of stockRows) {
            mapa.set(
                texto(r.idE)
                    .trim()
                    .replace(/\.0$/, ""),
                r
            );
        }

        return mapa;
    }


    function renderEspecificos(
        bloque,
        proyecto,
        stockMap
    ) {
        const tbody =
            bloque.querySelector(
                ".tabla-especificos tbody"
            );

        tbody.replaceChildren();

        const ids =
            idsEspecificos(proyecto);

        if (!ids.length) {
            const tr =
                document.createElement("tr");

            const td =
                crearCelda(
                    "Sin componentes específicos configurados para este proyecto.",
                    ""
                );

            td.colSpan = 3;
            td.className =
                "sin-configuracion";

            tr.appendChild(td);
            tbody.appendChild(tr);
            return;
        }

        const filas =
            ids
                .map(id => stockMap.get(id))
                .filter(Boolean);

        if (!filas.length) {
            const tr =
                document.createElement("tr");

            const td =
                crearCelda(
                    "Los componentes específicos configurados no fueron encontrados en Stock.",
                    ""
                );

            td.colSpan = 3;
            td.className =
                "sin-configuracion";

            tr.appendChild(td);
            tbody.appendChild(tr);
            return;
        }

        for (const r of filas) {
            const tr =
                document.createElement("tr");

            tr.appendChild(
                crearCelda(
                    texto(r.idE)
                        .replace(/\.0$/, ""),
                    "idE"
                )
            );

            tr.appendChild(
                crearCelda(
                    r.cs_desc,
                    "Descripción",
                    "descripcion-celda"
                )
            );

            tr.appendChild(
                crearCeldaNumero(
                    r.cs_ctda,
                    "Existencia"
                )
            );

            tbody.appendChild(tr);
        }
    }


    function proyectosDesdeSecuencias(
        secuencias
    ) {
        const mapa =
            new Map();

        for (const r of secuencias) {
            const nombre =
                texto(r.gs_proyecto).trim();

            if (!nombre) {
                continue;
            }

            const clave =
                normalizar(nombre);

            if (!mapa.has(clave)) {
                mapa.set(clave, nombre);
            }
        }

        /*
          Incluir también proyectos que cuentan con una configuración
          conocida de Componentes Específicos, aunque temporalmente no
          tengan secuencias.
        */
        for (
            const nombre
            of Object.keys(
                COMPONENTES_POR_PROYECTO
            )
        ) {
            const clave =
                normalizar(nombre);

            if (!mapa.has(clave)) {
                mapa.set(clave, nombre);
            }
        }

        return [...mapa.values()]
            .sort(
                (a, b) =>
                    a.localeCompare(
                        b,
                        "es",
                        {
                            sensitivity:
                                "base",
                            numeric:
                                true
                        }
                    )
            );
    }


    function secuenciasProyecto(
        secuencias,
        proyecto
    ) {
        const clave =
            normalizar(proyecto);

        return secuencias.filter(
            r =>
                normalizar(r.gs_proyecto)
                === clave
        );
    }


    function renderIndice(
        proyectos
    ) {
        indice.replaceChildren();

        for (
            const proyecto
            of proyectos
        ) {
            const a =
                document.createElement("a");

            a.href =
                `#proyecto-${slugProyecto(proyecto)}`;

            a.textContent =
                proyecto;

            indice.appendChild(a);
        }
    }


    function renderTodo(
        secuencias,
        stockRows
    ) {
        const proyectos =
            proyectosDesdeSecuencias(
                secuencias
            );

        const stockMap =
            mapaStock(stockRows);

        contenedor.replaceChildren();
        renderIndice(proyectos);

        for (
            const proyecto
            of proyectos
        ) {
            const filasProyecto =
                secuenciasProyecto(
                    secuencias,
                    proyecto
                );

            const bloque =
                crearBloque(proyecto);

            contenedor.appendChild(bloque);

            renderDisponibilidad(
                bloque,
                proyecto,
                filasProyecto
            );

            renderSecuencias(
                bloque,
                filasProyecto
            );

            renderEspecificos(
                bloque,
                proyecto,
                stockMap
            );

            const estado =
                bloque.querySelector(
                    ".estado-bloque"
                );

            const visibles =
                filasProyecto.filter(
                    r =>
                        texto(r.gs_ver)
                            .trim()
                            .toUpperCase()
                        !== "N"
                ).length;

            estado.textContent =
                `${visibles} secuencia(s) visible(s)`;
        }

        return proyectos.length;
    }


    async function actualizarTodo() {
        estadoGlobal.textContent =
            "Actualizando todos los proyectos desde Supabase...";

        estadoGlobal.style.color =
            "#657786";

        estadoGlobal.style.borderColor =
            "#cdd8e2";

        estadoGlobal.style.background =
            "#ffffff";

        try {
            const [
                secuencias,
                stockRows
            ] =
                await Promise.all([
                    fetchTabla(
                        "gs_secuencias",
                        [
                            "gs_id",
                            "gs_proceso",
                            "gs_subproceso",
                            "gs_proyecto",
                            "gs_lote",
                            "gs_prior",
                            "gs_fecha",
                            "gs_desc",
                            "gs_ctda",
                            "gs_estado",
                            "gs_ver",
                            "gs_fecha_cum"
                        ].join(",")
                    ),
                    fetchTabla(
                        "cs_stock",
                        [
                            "idE",
                            "cs_desc",
                            "cs_ctda",
                            "cs_ctmi",
                            "cs_tipo",
                            "cs_observe"
                        ].join(",")
                    )
                ]);

            const totalProyectos =
                renderTodo(
                    secuencias,
                    stockRows
                );

            actualizarFooter();

            const hora =
                new Date()
                    .toLocaleTimeString(
                        "es-MX",
                        {
                            hour: "2-digit",
                            minute: "2-digit",
                            second: "2-digit",
                            hour12: false
                        }
                    );

            estadoGlobal.textContent =
                `Supabase conectado · ` +
                `${totalProyectos} proyecto(s) · ` +
                `${secuencias.length} secuencia(s) · ` +
                `${hora}`;

            estadoGlobal.style.color =
                "#1f6334";

            estadoGlobal.style.borderColor =
                "#b9ddc3";

            estadoGlobal.style.background =
                "#eef9f1";

        } catch (error) {
            console.error(error);

            estadoGlobal.textContent =
                "Error al obtener los proyectos desde Supabase";

            estadoGlobal.style.color =
                "#a02a2a";

            estadoGlobal.style.borderColor =
                "#e5b8b8";

            estadoGlobal.style.background =
                "#fff1f1";
        }
    }


    actualizarFooter();
    actualizarTodo();

    window.setInterval(
        actualizarTodo,
        60000
    );
})();
</script>
