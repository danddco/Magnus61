<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0" name="viewport"/>
<title>Administrar Registros</title>
<style>
:root {
  --azul:#1f4e78; --azul2:#346b98; --fondo:#f4f6f8; --texto:#26333f;
  --borde:#d8dee5; --verde:#1f6334; --rojo:#a02a2a; --amarillo:#fff3cd;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--fondo);color:var(--texto)}
header{background:linear-gradient(135deg,var(--azul),var(--azul2));color:white;padding:14px 16px}
header h1{margin:0;font-size:22px}
header p{margin:5px 0 0;font-size:13px;opacity:.9}
main{width:min(1100px,96%);margin:14px auto 40px}
.panel{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 1px 5px rgba(0,0,0,.05)}
.hidden{display:none!important}
.notice{border-left:5px solid #d18b00;background:#fff8e6}
label{display:block;font-weight:700;margin:10px 0 5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #bcc7d1;border-radius:7px;font:inherit;background:#fff}
textarea{min-height:80px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{border:0;border-radius:7px;padding:10px 14px;font-weight:800;cursor:pointer;min-height:42px}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:var(--azul);color:#fff}
.secondary{background:#e9eef2;color:#30485d}
.danger{background:#b42318;color:#fff}
.success{background:#287a42;color:#fff}
#estado{font-size:13px;font-weight:700;margin:8px 0}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.toolbar h2{margin:0;font-size:20px}
.card{background:#fff;border:1px solid var(--borde);border-radius:10px;margin:0 0 10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.row{display:grid;grid-template-columns:minmax(110px,35%) minmax(0,65%);padding:8px 10px;border-bottom:1px solid var(--borde);align-items:center}
.row:last-child{border-bottom:0}
.k{font-weight:800;color:#30485d;padding-right:8px}
.v{overflow-wrap:anywhere}
.card-actions{display:flex;gap:8px;padding:10px;background:#f8fafb}
.idr{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.qty{font-weight:800}
.error{color:#a02a2a!important}
.ok{color:#1f6334!important}
@media(max-width:700px){
  main{width:100%;padding:0 7px}
  .grid{grid-template-columns:1fr}
  .toolbar{align-items:stretch;flex-direction:column}
}
</style>
<style>
#cr_idE,
#cr_desc {
    background-color: #fff;
}

#estado-stock {
    line-height: 1.35;
}

@media (max-width:700px) {
    #cr_idE,
    #cr_desc {
        font-size: 17px;
        min-height: 44px;
    }
}
</style><style>
#cr_accion {
    background-color: #fff;
}

@media (max-width:700px) {
    #cr_accion {
        font-size: 17px;
        min-height: 44px;
    }
}
</style>
<style>
.auth-wrap{max-width:520px;margin:24px auto}
.auth-title{margin:0 0 6px;font-size:21px;color:#123b5d}
.auth-sub{margin:0 0 14px;color:#657786;font-size:13px;line-height:1.45}
.auth-error{margin-top:10px;color:#a02a2a;font-weight:700;white-space:pre-wrap}
.auth-ok{margin-top:10px;color:#1f6334;font-weight:700}
.sessionbar{display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-left:5px solid #287a42;background:#edf8f0}
.session-user{font-weight:800;overflow-wrap:anywhere}
@media(max-width:700px){
  .sessionbar{align-items:stretch;flex-direction:column}
  .auth-wrap{margin:14px auto}
}
</style>

</head>
<body>
<header>
<h1>Administrar Registros</h1>
<p>Tabla cr_registros · versión móvil simplificada</p>
</header>
<main>

<section id="authPanel" class="panel auth-wrap">
  <h2 class="auth-title">Acceso autorizado</h2>
  <p class="auth-sub">
    Inicia sesión con tu usuario de Supabase para consultar y modificar información.
  </p>
  <form id="loginForm">
    <label>Correo</label>
    <input id="authEmail" type="email" autocomplete="username" required>
    <label>Contraseña</label>
    <input id="authPassword" type="password" autocomplete="current-password" required>
    <div class="actions">
      <button id="loginBtn" type="submit" class="primary">Iniciar sesión</button>
    </div>
    <div id="authEstado"></div>
  </form>
</section>

<div id="appContent" class="hidden">
  <section class="panel sessionbar">
    <div>
      <div style="font-size:12px;color:#657786">Sesión autenticada</div>
      <div id="authUsuario" class="session-user"></div>
    </div>
    <button id="logoutBtn" type="button" class="secondary">Cerrar sesión</button>
  </section>

<section class="panel">
<div class="toolbar">
<div>
<h2>Registros</h2>
<div id="estado">Iniciando...</div>
</div>
<div class="actions" style="margin-top:0">
<button class="success" id="newBtn" type="button">+ Nuevo</button>
<button class="secondary" id="refreshBtn" type="button">Actualizar</button>
</div>
</div>
<input id="search" placeholder="Buscar id, fecha, idE, descripción o acción..."/>
</section>
<section class="panel hidden" id="formPanel">
<h2 id="formTitle">Nuevo registro</h2>
<input id="editId" type="hidden"/>
<div class="grid">
<div>
<label>Fecha</label>
<input id="cr_fecha" type="date"/>
</div>
<div>
<label>idE</label>
<input autocomplete="off" id="cr_idE" list="lista-idE" placeholder="Escribe o selecciona un idE..."/><datalist id="lista-idE"></datalist>
</div>
<div>
<label>Cantidad</label>
<input id="cr_ctda" step="any" type="number"/>
</div>
<div>
<label>Acción</label>
<input autocomplete="off" id="cr_accion" list="lista-accion" placeholder="Escribe o selecciona una acción..."/><datalist id="lista-accion"></datalist>
</div>
</div>
<label>Descripción</label>
<input autocomplete="off" id="cr_desc" list="lista-desc" placeholder="Escribe o selecciona una descripción..." type="text"/><datalist id="lista-desc"></datalist><div id="estado-stock" style="margin-top:6px;font:600 12px Arial,sans-serif;color:#657786;">Cargando catálogo cs_stock...</div>
<div class="actions">
<button class="primary" id="saveBtn" type="button">Guardar</button>
<button class="secondary" id="cancelBtn" type="button">Cancelar</button>
</div>
</section>
<section id="list"></section>
</div>
</main>
<script>
(function() {
"use strict";

const SUPABASE_URL = 'https://ysyxjcwjtvklxvhwnxsi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzeXhqY3dqdHZrbHh2aHdueHNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY1MDU0OTEsImV4cCI6MjA3MjA4MTQ5MX0.xjw3tRBPZoS4YX49VS7Nn1HT9Owv-q8fR4txMivjIuM';
const TABLA = "cr_registros";

const $ = id => document.getElementById(id);

const AUTH_STORAGE_KEY = "circuitdesignmx_supabase_session";
let authSession = null;

function authSetEstado(msg, tipo="") {
  const el = $("authEstado");
  if (!el) return;
  el.textContent = msg || "";
  el.className = tipo === "ok" ? "auth-ok" : (tipo === "error" ? "auth-error" : "");
}

function guardarSesion(sesion) {
  authSession = sesion || null;
  if (authSession) {
    sessionStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(authSession));
  } else {
    sessionStorage.removeItem(AUTH_STORAGE_KEY);
  }
}

function cargarSesionGuardada() {
  try {
    const raw = sessionStorage.getItem(AUTH_STORAGE_KEY);
    authSession = raw ? JSON.parse(raw) : null;
  } catch {
    authSession = null;
    sessionStorage.removeItem(AUTH_STORAGE_KEY);
  }
  return authSession;
}

function mostrarLogin() {
  $("authPanel").classList.remove("hidden");
  $("appContent").classList.add("hidden");
  authSetEstado("");
  setTimeout(() => $("authEmail").focus(), 0);
}

function mostrarAplicacion() {
  $("authPanel").classList.add("hidden");
  $("appContent").classList.remove("hidden");
  const correo =
    authSession?.user?.email ||
    authSession?.email ||
    "Usuario autenticado";
  $("authUsuario").textContent = correo;
}

async function authRequest(grantType, body) {
  const res = await fetch(
    `${SUPABASE_URL}/auth/v1/token?grant_type=${encodeURIComponent(grantType)}`,
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify(body),
      cache: "no-store"
    }
  );

  const raw = await res.text();
  let data = null;

  if (raw) {
    try { data = JSON.parse(raw); }
    catch { data = raw; }
  }

  if (!res.ok) {
    const detalle =
      (typeof data === "object" && data)
        ? (data.msg || data.message || data.error_description || JSON.stringify(data))
        : raw;
    throw new Error(detalle || `HTTP ${res.status}`);
  }

  const now = Math.floor(Date.now() / 1000);
  data.expires_at = data.expires_at || (now + Number(data.expires_in || 3600));
  return data;
}

async function iniciarSesion(email, password) {
  const sesion = await authRequest("password", {email, password});
  guardarSesion(sesion);
  return sesion;
}

async function refrescarSesion() {
  if (!authSession?.refresh_token) {
    throw new Error("La sesión terminó. Inicia sesión nuevamente.");
  }

  const sesion = await authRequest(
    "refresh_token",
    {refresh_token: authSession.refresh_token}
  );

  guardarSesion(sesion);
  return sesion;
}

async function asegurarSesion() {
  if (!authSession?.access_token) {
    throw new Error("No hay una sesión autenticada.");
  }

  const ahora = Math.floor(Date.now() / 1000);
  const expira = Number(authSession.expires_at || 0);

  if (!expira || expira <= ahora + 60) {
    await refrescarSesion();
  }

  return authSession.access_token;
}

async function fetchAutenticado(url, opciones={}, reintentar=true) {
  const token = await asegurarSesion();

  const headersActuales = new Headers(opciones.headers || {});
  headersActuales.set("apikey", SUPABASE_ANON_KEY);
  headersActuales.set("Authorization", `Bearer ${token}`);

  const res = await fetch(url, {
    ...opciones,
    headers: headersActuales,
    cache: "no-store"
  });

  if (res.status === 401 && reintentar && authSession?.refresh_token) {
    await refrescarSesion();
    return fetchAutenticado(url, opciones, false);
  }

  return res;
}

async function cerrarSesion() {
  const token = authSession?.access_token;

  if (token) {
    try {
      await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${token}`
        }
      });
    } catch (e) {
      console.warn("No se pudo notificar logout remoto:", e);
    }
  }

  guardarSesion(null);
  mostrarLogin();
}

async function iniciarAutenticacion(cargarApp) {
  cargarSesionGuardada();

  if (authSession?.access_token) {
    try {
      await asegurarSesion();
      mostrarAplicacion();
      await cargarApp();
      return;
    } catch (e) {
      console.warn("Sesión guardada no válida:", e);
      guardarSesion(null);
    }
  }

  mostrarLogin();
}

$("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const btn = $("loginBtn");
  const email = $("authEmail").value.trim();
  const password = $("authPassword").value;

  btn.disabled = true;
  btn.textContent = "Entrando...";
  authSetEstado("Autenticando...");

  try {
    await iniciarSesion(email, password);
    $("authPassword").value = "";
    authSetEstado("Acceso correcto.", "ok");
    mostrarAplicacion();
    await cargarAplicacionAutenticada();
  } catch (e) {
    console.error(e);
    guardarSesion(null);
    authSetEstado("No fue posible iniciar sesión:\n" + e.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Iniciar sesión";
  }
});

$("logoutBtn").addEventListener("click", cerrarSesion);

let registros = [];
let stockCatalogo = [];
let stockPorIdE = new Map();
let stockPorDesc = new Map();

function texto(v) {
  return v === null || v === undefined ? "" : String(v);
}

function setEstado(msg, tipo="") {
  const el = $("estado");
  el.textContent = msg;
  el.className = tipo;
}

function esc(s) {
  return texto(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function mostrarNumero(v) {
  if (v === null || v === undefined || texto(v).trim() === "") return "";
  const n = Number(v);
  if (!Number.isFinite(n)) return texto(v);
  return Number.isInteger(n) ? String(n) : String(Number(n.toFixed(6)));
}

function headers(extra={}) {
  return {
    "apikey": SUPABASE_ANON_KEY,
    "Content-Type": "application/json",
    "Accept": "application/json",
    ...extra
  };
}

async function apiTabla(tabla, method, query="", body=undefined, prefer="") {
  const url = `${SUPABASE_URL}/rest/v1/${tabla}${query}`;
  const opts = {
    method,
    headers: headers(prefer ? {"Prefer": prefer} : {}),
    cache: "no-store"
  };

  if (body !== undefined) opts.body = JSON.stringify(body);

  const res = await fetchAutenticado(url, opts);
  const raw = await res.text();

  let data = null;
  if (raw) {
    try { data = JSON.parse(raw); }
    catch { data = raw; }
  }

  if (!res.ok) {
    const detalle = typeof data === "object" && data
      ? (data.message || data.details || JSON.stringify(data))
      : raw;
    throw new Error(`HTTP ${res.status} · ${detalle || "Error Supabase"}`);
  }

  return data;
}

async function api(method, query="", body=undefined, prefer="") {
  return apiTabla(TABLA, method, query, body, prefer);
}


function normalizarClave(v) {
  return texto(v).trim().toLowerCase();
}

function completarDesdeIdE() {
  const id = texto($("cr_idE").value).trim();
  if (!id) return;

  const item = stockPorIdE.get(id);
  if (item) {
    $("cr_desc").value = texto(item.cs_desc);
  }
}

function completarDesdeDescripcion() {
  const desc = texto($("cr_desc").value).trim();
  if (!desc) return;

  const item = stockPorDesc.get(normalizarClave(desc));
  if (item) {
    $("cr_idE").value = texto(item.idE);
    $("cr_desc").value = texto(item.cs_desc);
  }
}

async function cargarCatalogoStock() {
  const status = $("estado-stock");

  try {
    status.textContent = "Cargando catálogo cs_stock...";

    const select = encodeURIComponent("idE,cs_desc");
    const data = await apiTabla(
      "cs_stock",
      "GET",
      `?select=${select}&order=idE.asc&limit=5000`
    );

    stockCatalogo = Array.isArray(data)
      ? data.filter(x =>
          texto(x.idE).trim() !== "" &&
          texto(x.cs_desc).trim() !== ""
        )
      : [];

    stockPorIdE = new Map();
    stockPorDesc = new Map();

    const listaIdE = $("lista-idE");
    const listaDesc = $("lista-desc");

    listaIdE.replaceChildren();
    listaDesc.replaceChildren();

    for (const item of stockCatalogo) {
      const id = texto(item.idE).trim();
      const desc = texto(item.cs_desc).trim();

      stockPorIdE.set(id, item);

      // Para descripciones repetidas se conserva la primera coincidencia.
      const claveDesc = normalizarClave(desc);
      if (!stockPorDesc.has(claveDesc)) {
        stockPorDesc.set(claveDesc, item);
      }

      const opId = document.createElement("option");
      opId.value = id;
      opId.label = desc;
      listaIdE.appendChild(opId);

      const opDesc = document.createElement("option");
      opDesc.value = desc;
      opDesc.label = `idE ${id}`;
      listaDesc.appendChild(opDesc);
    }

    status.textContent =
      `cs_stock cargado · ${stockCatalogo.length} componentes`;

  } catch (e) {
    console.error(e);
    status.textContent =
      "No fue posible cargar cs_stock: " + e.message;
    status.style.color = "#a02a2a";
  }
}


function actualizarListaAcciones() {
  const lista = $("lista-accion");
  if (!lista) return;

  const acciones = [...new Set(
    registros
      .map(r => texto(r.cr_accion).trim())
      .filter(Boolean)
  )].sort((a,b) => a.localeCompare(b, "es", { sensitivity: "base" }));

  lista.replaceChildren();

  for (const accion of acciones) {
    const option = document.createElement("option");
    option.value = accion;
    lista.appendChild(option);
  }
}

async function cargar() {
  try {
    setEstado("Actualizando...");

    const select = encodeURIComponent(
      "cr_id,cr_fecha,cr_idE,cr_desc,cr_ctda,cr_accion"
    );

    const data = await api(
      "GET",
      `?select=${select}&order=cr_fecha.desc,cr_id.desc&limit=300`
    );

    registros = Array.isArray(data) ? data : [];
    actualizarListaAcciones();
    render();

    setEstado(`Supabase conectado · ${registros.length} registros`, "ok");

  } catch (e) {
    console.error(e);
    setEstado("Error de lectura: " + e.message, "error");
    $("list").innerHTML = `<div class="panel error">${esc(e.message)}</div>`;
  }
}

function render() {
  const q = $("search").value.trim().toLowerCase();

  const visibles = registros.filter(r => {
    const blob = [
      r.cr_id, r.cr_fecha, r.cr_idE, r.cr_desc, r.cr_accion
    ].map(texto).join(" ").toLowerCase();

    return !q || blob.includes(q);
  });

  $("list").innerHTML = visibles.map(r => `
    <article class="card">
      <div class="row"><div class="k">id_R</div><div class="v idr">${esc(r.cr_id)}</div></div>
      <div class="row"><div class="k">Fecha</div><div class="v">${esc(texto(r.cr_fecha).slice(0,10))}</div></div>
      <div class="row"><div class="k">idE</div><div class="v">${esc(r.cr_idE)}</div></div>
      <div class="row"><div class="k">Descripción</div><div class="v">${esc(r.cr_desc)}</div></div>
      <div class="row"><div class="k">Cantidad</div><div class="v qty">${esc(mostrarNumero(r.cr_ctda))}</div></div>
      <div class="row"><div class="k">Acción</div><div class="v">${esc(r.cr_accion)}</div></div>

      <div class="card-actions">
        <button type="button" class="primary" data-edit="${esc(r.cr_id)}">Editar</button>
        <button type="button" class="danger" data-delete="${esc(r.cr_id)}">Eliminar</button>
      </div>
    </article>
  `).join("");

  document.querySelectorAll("[data-edit]").forEach(btn => {
    btn.addEventListener("click", () => editar(Number(btn.dataset.edit)));
  });

  document.querySelectorAll("[data-delete]").forEach(btn => {
    btn.addEventListener("click", () => eliminar(Number(btn.dataset.delete)));
  });
}

function limpiarFormulario() {
  $("editId").value = "";
  [
    "cr_fecha","cr_idE","cr_desc","cr_ctda","cr_accion"
  ].forEach(id => $(id).value = "");
}

function nuevo() {
  limpiarFormulario();
  $("formTitle").textContent = "Nuevo registro";
  $("formPanel").classList.remove("hidden");

  // Fecha de hoy por comodidad
  const hoy = new Date();
  const y = hoy.getFullYear();
  const m = String(hoy.getMonth()+1).padStart(2,"0");
  const d = String(hoy.getDate()).padStart(2,"0");
  $("cr_fecha").value = `${y}-${m}-${d}`;

  $("cr_idE").focus();
  window.scrollTo({top:0, behavior:"smooth"});
}

function editar(id) {
  const r = registros.find(x => Number(x.cr_id) === Number(id));

  if (!r) {
    alert("No se encontró el registro.");
    return;
  }

  $("formTitle").textContent = "Editar id_R " + id;
  $("editId").value = id;

  $("cr_fecha").value = texto(r.cr_fecha).slice(0,10);
  $("cr_idE").value = texto(r.cr_idE);
  $("cr_desc").value = texto(r.cr_desc);
  $("cr_ctda").value = texto(r.cr_ctda);
  $("cr_accion").value = texto(r.cr_accion);

  $("formPanel").classList.remove("hidden");
  window.scrollTo({top:0, behavior:"smooth"});
}

function numeroONull(id) {
  const raw = $(id).value.trim();
  if (raw === "") return null;
  const n = Number(raw);
  return Number.isFinite(n) ? n : null;
}

function payload() {
  return {
    cr_fecha: $("cr_fecha").value || null,
    cr_idE: $("cr_idE").value.trim() || null,
    cr_desc: $("cr_desc").value.trim() || null,
    cr_ctda: numeroONull("cr_ctda"),
    cr_accion: $("cr_accion").value.trim() || null
  };
}

async function guardar() {
  const btn = $("saveBtn");
  const id = $("editId").value;

  btn.disabled = true;
  btn.textContent = "Guardando...";

  try {
    if (id) {
      await api(
        "PATCH",
        `?cr_id=eq.${encodeURIComponent(id)}`,
        payload(),
        "return=representation"
      );
    } else {
      await api(
        "POST",
        "",
        payload(),
        "return=representation"
      );
    }

    $("formPanel").classList.add("hidden");
    setEstado(id ? "Registro actualizado correctamente." : "Registro creado correctamente.", "ok");
    await cargar();

  } catch (e) {
    console.error(e);
    alert(
      "No fue posible guardar:\n\n" + e.message +
      "\n\nSi el error menciona RLS o permisos, revisa las políticas para el rol authenticated."
    );
    setEstado("Error al guardar: " + e.message, "error");

  } finally {
    btn.disabled = false;
    btn.textContent = "Guardar";
  }
}

async function eliminar(id) {
  if (!confirm("¿Eliminar definitivamente el registro id_R " + id + "?")) return;

  try {
    setEstado("Eliminando id_R " + id + "...");

    await api(
      "DELETE",
      `?cr_id=eq.${encodeURIComponent(id)}`,
      undefined,
      "return=representation"
    );

    setEstado("Registro eliminado correctamente.", "ok");
    await cargar();

  } catch (e) {
    console.error(e);
    alert(
      "No fue posible eliminar:\n\n" + e.message +
      "\n\nSi el error menciona RLS o permisos, revisa las políticas para el rol authenticated."
    );
    setEstado("Error al eliminar: " + e.message, "error");
  }
}

$("newBtn").addEventListener("click", nuevo);
$("refreshBtn").addEventListener("click", async () => {
  await Promise.all([cargarCatalogoStock(), cargar()]);
});
$("cancelBtn").addEventListener("click", () => $("formPanel").classList.add("hidden"));
$("saveBtn").addEventListener("click", guardar);
$("search").addEventListener("input", render);

/* Autocompletado bidireccional desde cs_stock */
$("cr_idE").addEventListener("input", completarDesdeIdE);
$("cr_idE").addEventListener("change", completarDesdeIdE);
$("cr_desc").addEventListener("input", completarDesdeDescripcion);
$("cr_desc").addEventListener("change", completarDesdeDescripcion);

async function cargarAplicacionAutenticada() {
  await Promise.all([
    cargarCatalogoStock(),
    cargar()
  ]);
}

iniciarAutenticacion(cargarAplicacionAutenticada);

})();
