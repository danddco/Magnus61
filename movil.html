<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Administrar Secuencias</title>
<style>
:root {
  --azul:#1f4e78; --azul2:#346b98; --fondo:#f4f6f8; --texto:#26333f;
  --borde:#d8dee5; --verde:#1f6334; --rojo:#a02a2a;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--fondo);color:var(--texto)}
header{background:linear-gradient(135deg,var(--azul),var(--azul2));color:white;padding:14px 16px}
header h1{margin:0;font-size:22px}
header p{margin:5px 0 0;font-size:13px;opacity:.9}
main{width:min(1100px,96%);margin:14px auto 40px}
.panel{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 1px 5px rgba(0,0,0,.05)}
.hidden{display:none!important}
.notice{border-left:5px solid #d18b00;background:#fff8e6}
label{display:block;font-weight:700;margin:10px 0 5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #bcc7d1;border-radius:7px;font:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{border:0;border-radius:7px;padding:10px 14px;font-weight:800;cursor:pointer;min-height:42px}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:var(--azul);color:#fff}
.secondary{background:#e9eef2;color:#30485d}
.danger{background:#b42318;color:#fff}
.success{background:#287a42;color:#fff}
#estado{font-size:13px;font-weight:700;margin:8px 0}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.toolbar h2{margin:0;font-size:20px}
.card{background:#fff;border:1px solid var(--borde);border-radius:10px;margin:0 0 10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card.pendiente{background:#f8d7da;color:#721c24}
.card.resuelto{background:#dff3e4;color:#1f6334}
.row{display:grid;grid-template-columns:minmax(110px,35%) minmax(0,65%);padding:8px 10px;border-bottom:1px solid var(--borde);align-items:center}
.row:last-child{border-bottom:0}
.k{font-weight:800;color:#30485d;padding-right:8px}
.card.pendiente .k{color:#721c24}
.card.resuelto .k{color:#1f6334}
.v{overflow-wrap:anywhere}
.card-actions{display:flex;gap:8px;padding:10px;background:rgba(255,255,255,.58)}
.idb{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-weight:800;background:#fff}
.error{color:#a02a2a!important}
.ok{color:#1f6334!important}
@media(max-width:700px){
  main{width:100%;padding:0 7px}
  .grid{grid-template-columns:1fr}
  .toolbar{align-items:stretch;flex-direction:column}
}
</style>
</head>
<body>

<header>
  <h1>Administrar gs_secuencias</h1>
  <p>Alta · edición · eliminación desde celular</p>
</header>

<main>
  <section class="panel notice">
    <strong>MODO PRUEBA SIN LOGIN</strong><br>
    La página entra directamente. Para escribir en Supabase deben estar habilitadas temporalmente las políticas RLS para <code>anon</code>.
  </section>

  <section class="panel">
    <div class="toolbar">
      <div>
        <h2>Secuencias</h2>
        <div id="estado">Iniciando...</div>
      </div>
      <div class="actions" style="margin-top:0">
        <button id="newBtn" type="button" class="success">+ Nuevo</button>
        <button id="refreshBtn" type="button" class="secondary">Actualizar</button>
      </div>
    </div>
    <input id="search" placeholder="Buscar proyecto, proceso, descripción, estado o id_B...">
  </section>

  <section id="formPanel" class="panel hidden">
    <h2 id="formTitle">Nuevo registro</h2>
    <input id="editId" type="hidden">

    <div class="grid">
      <div>
        <label>Proyecto</label>
        <input id="gs_proyecto">
      </div>
      <div>
        <label>Proceso</label>
        <input id="gs_proceso">
      </div>
      <div>
        <label>Fecha</label>
        <input id="gs_fecha" type="date">
      </div>
      <div>
        <label>Prioridad</label>
        <select id="gs_prior">
          <option value="">Sin prioridad</option>
          <option value="1">Alta</option>
          <option value="2">Media</option>
          <option value="3">Baja</option>
        </select>
      </div>
      <div>
        <label>Estado</label>
        <select id="gs_estado">
          <option value="Pendiente">Pendiente</option>
          <option value="Resuelto">Resuelto</option>
        </select>
      </div>
      <div>
        <label>Fecha cumplimiento</label>
        <input id="gs_fecha_cum" type="date">
      </div>
      <div>
        <label>Lote</label>
        <input id="gs_lote">
      </div>
      <div>
        <label>Cantidad</label>
        <input id="gs_ctda" type="number" step="any">
      </div>
      <div>
        <label>Visible</label>
        <select id="gs_ver">
          <option value="S">Sí</option>
          <option value="N">No</option>
        </select>
      </div>
    </div>

    <label>Descripción</label>
    <textarea id="gs_desc"></textarea>

    <div class="actions">
      <button id="saveBtn" type="button" class="primary">Guardar</button>
      <button id="cancelBtn" type="button" class="secondary">Cancelar</button>
    </div>
  </section>

  <section id="list"></section>
</main>

<script>
(function() {
"use strict";

const SUPABASE_URL = 'https://ysyxjcwjtvklxvhwnxsi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzeXhqY3dqdHZrbHh2aHdueHNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY1MDU0OTEsImV4cCI6MjA3MjA4MTQ5MX0.xjw3tRBPZoS4YX49VS7Nn1HT9Owv-q8fR4txMivjIuM';
const TABLA = "gs_secuencias";

const $ = id => document.getElementById(id);
let registros = [];

function texto(v) {
  return v === null || v === undefined ? "" : String(v);
}

function setEstado(msg, tipo="") {
  const el = $("estado");
  el.textContent = msg;
  el.className = tipo;
}

function esc(s) {
  return texto(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function prioridadTexto(v) {
  const s = texto(v);
  if (s === "1") return "Alta";
  if (s === "2") return "Media";
  if (s === "3") return "Baja";
  return s;
}

function estadoClase(v) {
  const s = texto(v).trim().toLowerCase();
  if (s === "pendiente") return "pendiente";
  if (s === "resuelto") return "resuelto";
  return "";
}

function fechaVisible(r) {
  const resuelto = texto(r.gs_estado).trim().toLowerCase() === "resuelto";
  if (resuelto) return r.gs_fecha_cum || r.gs_fecha || "";
  return r.gs_fecha || "";
}

function headers(extra={}) {
  return {
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json",
    "Accept": "application/json",
    ...extra
  };
}

async function api(method, query="", body=undefined, prefer="") {
  const url = `${SUPABASE_URL}/rest/v1/${TABLA}${query}`;
  const opts = {
    method,
    headers: headers(prefer ? {"Prefer": prefer} : {}),
    cache: "no-store"
  };
  if (body !== undefined) opts.body = JSON.stringify(body);

  const res = await fetch(url, opts);
  const raw = await res.text();

  let data = null;
  if (raw) {
    try { data = JSON.parse(raw); }
    catch { data = raw; }
  }

  if (!res.ok) {
    let detalle = typeof data === "object" && data
      ? (data.message || data.details || JSON.stringify(data))
      : raw;
    throw new Error(`HTTP ${res.status} · ${detalle || "Error Supabase"}`);
  }

  return data;
}

function ordenar() {
  registros.sort((a,b) => {
    const ap = texto(a.gs_estado).trim().toLowerCase() === "pendiente";
    const bp = texto(b.gs_estado).trim().toLowerCase() === "pendiente";

    if (ap !== bp) return ap ? -1 : 1;

    if (ap && bp) {
      const pa = Number(a.gs_prior) || 999;
      const pb = Number(b.gs_prior) || 999;
      if (pa !== pb) return pa - pb;
    }

    return texto(fechaVisible(b)).localeCompare(texto(fechaVisible(a))) ||
           ((Number(b.gs_id)||0) - (Number(a.gs_id)||0));
  });
}

async function cargar() {
  try {
    setEstado("Actualizando...");
    const select = encodeURIComponent(
      "gs_id,gs_proceso,gs_proyecto,gs_lote,gs_fecha,gs_desc,gs_ctda,gs_prior,gs_estado,gs_ver,gs_fecha_cum"
    );

    const data = await api(
      "GET",
      `?select=${select}&order=gs_id.desc&limit=300`
    );

    registros = Array.isArray(data) ? data : [];
    ordenar();
    render();
    setEstado(`Supabase conectado · ${registros.length} registros`, "ok");
  } catch (e) {
    console.error(e);
    setEstado("Error de lectura: " + e.message, "error");
    $("list").innerHTML = `<div class="panel error">${esc(e.message)}</div>`;
  }
}

function render() {
  const q = $("search").value.trim().toLowerCase();

  const visibles = registros.filter(r => {
    const blob = [
      r.gs_id, r.gs_proyecto, r.gs_proceso,
      r.gs_desc, r.gs_estado
    ].map(texto).join(" ").toLowerCase();

    return !q || blob.includes(q);
  });

  $("list").innerHTML = visibles.map(r => `
    <article class="card ${estadoClase(r.gs_estado)}">
      <div class="row"><div class="k">id_B</div><div class="v idb">${esc(r.gs_id)}</div></div>
      <div class="row"><div class="k">Proyecto</div><div class="v">${esc(r.gs_proyecto)}</div></div>
      <div class="row"><div class="k">Proceso</div><div class="v">${esc(r.gs_proceso)}</div></div>
      <div class="row"><div class="k">Fecha</div><div class="v">${esc(fechaVisible(r))}</div></div>
      <div class="row"><div class="k">Descripción</div><div class="v">${esc(r.gs_desc)}</div></div>
      <div class="row"><div class="k">Prioridad</div><div class="v">${esc(prioridadTexto(r.gs_prior))}</div></div>
      <div class="row"><div class="k">Estado</div><div class="v"><span class="badge">${esc(r.gs_estado)}</span></div></div>
      <div class="card-actions">
        <button type="button" class="primary" data-edit="${esc(r.gs_id)}">Editar</button>
        <button type="button" class="danger" data-delete="${esc(r.gs_id)}">Eliminar</button>
      </div>
    </article>
  `).join("");

  document.querySelectorAll("[data-edit]").forEach(btn => {
    btn.addEventListener("click", () => editar(Number(btn.dataset.edit)));
  });

  document.querySelectorAll("[data-delete]").forEach(btn => {
    btn.addEventListener("click", () => eliminar(Number(btn.dataset.delete)));
  });
}

function limpiarFormulario() {
  $("editId").value = "";
  ["gs_proyecto","gs_proceso","gs_lote","gs_fecha","gs_desc","gs_ctda","gs_fecha_cum"]
    .forEach(id => $(id).value = "");
  $("gs_prior").value = "";
  $("gs_estado").value = "Pendiente";
  $("gs_ver").value = "S";
}

function nuevo() {
  limpiarFormulario();
  $("formTitle").textContent = "Nuevo registro";
  $("formPanel").classList.remove("hidden");
  $("gs_proyecto").focus();
  window.scrollTo({top:0, behavior:"smooth"});
}

function editar(id) {
  const r = registros.find(x => Number(x.gs_id) === Number(id));
  if (!r) {
    alert("No se encontró el registro.");
    return;
  }

  $("formTitle").textContent = "Editar id_B " + id;
  $("editId").value = id;
  $("gs_proyecto").value = texto(r.gs_proyecto);
  $("gs_proceso").value = texto(r.gs_proceso);
  $("gs_lote").value = texto(r.gs_lote);
  $("gs_fecha").value = texto(r.gs_fecha).slice(0,10);
  $("gs_desc").value = texto(r.gs_desc);
  $("gs_ctda").value = texto(r.gs_ctda);
  $("gs_prior").value = texto(r.gs_prior);
  $("gs_estado").value = texto(r.gs_estado) || "Pendiente";
  $("gs_ver").value = texto(r.gs_ver) || "S";
  $("gs_fecha_cum").value = texto(r.gs_fecha_cum).slice(0,10);

  $("formPanel").classList.remove("hidden");
  window.scrollTo({top:0, behavior:"smooth"});
}

function payload() {
  const estado = $("gs_estado").value;

  return {
    gs_proyecto: $("gs_proyecto").value.trim() || null,
    gs_proceso: $("gs_proceso").value.trim() || null,
    gs_lote: $("gs_lote").value.trim() || null,
    gs_fecha: $("gs_fecha").value || null,
    gs_desc: $("gs_desc").value.trim() || null,
    gs_ctda: $("gs_ctda").value === "" ? null : Number($("gs_ctda").value),
    gs_prior: $("gs_prior").value || null,
    gs_estado: estado,
    gs_ver: $("gs_ver").value || "S",
    gs_fecha_cum: estado === "Resuelto"
      ? ($("gs_fecha_cum").value || null)
      : null
  };
}

async function guardar() {
  const btn = $("saveBtn");
  const id = $("editId").value;

  btn.disabled = true;
  btn.textContent = "Guardando...";

  try {
    if (id) {
      await api(
        "PATCH",
        `?gs_id=eq.${encodeURIComponent(id)}`,
        payload(),
        "return=representation"
      );
    } else {
      await api(
        "POST",
        "",
        payload(),
        "return=representation"
      );
    }

    $("formPanel").classList.add("hidden");
    setEstado(id ? "Registro actualizado correctamente." : "Registro creado correctamente.", "ok");
    await cargar();

  } catch (e) {
    console.error(e);
    alert("No fue posible guardar:\n\n" + e.message +
          "\n\nSi el error menciona RLS o permisos, ejecuta el SQL de prueba para anon.");
    setEstado("Error al guardar: " + e.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Guardar";
  }
}

async function eliminar(id) {
  if (!confirm("¿Eliminar definitivamente el registro id_B " + id + "?")) return;

  try {
    setEstado("Eliminando id_B " + id + "...");
    await api(
      "DELETE",
      `?gs_id=eq.${encodeURIComponent(id)}`,
      undefined,
      "return=representation"
    );

    setEstado("Registro eliminado correctamente.", "ok");
    await cargar();

  } catch (e) {
    console.error(e);
    alert("No fue posible eliminar:\n\n" + e.message +
          "\n\nSi el error menciona RLS o permisos, ejecuta el SQL de prueba para anon.");
    setEstado("Error al eliminar: " + e.message, "error");
  }
}

$("newBtn").addEventListener("click", nuevo);
$("refreshBtn").addEventListener("click", cargar);
$("cancelBtn").addEventListener("click", () => $("formPanel").classList.add("hidden"));
$("saveBtn").addEventListener("click", guardar);
$("search").addEventListener("input", render);

cargar();

})();
</script>
</body>
</html>
